<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFlow Dashboard & Developer Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navbar -->
    <header
        class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="/"
                class="w-10 h-10 bg-gradient-to-tr from-violet-600 to-indigo-500 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-bolt text-white text-lg"></i>
            </a>
            <div>
                <h1 class="font-bold text-lg tracking-tight">PulseFlow Dashboard</h1>
                <p class="text-xs text-slate-400">Cloudflare D1 + Developer Sandbox</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <!-- Developer Mode Toggle -->
            <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs">
                <span class="text-slate-400 font-medium">Developer Mode:</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="dev-mode-toggle" onchange="toggleDevMode()" class="sr-only peer" checked>
                    <div
                        class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600">
                    </div>
                </label>
            </div>
            <a href="/"
                class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
                <i class="fa-solid fa-house mr-1"></i> Public Home
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left 2 Cols: Composer & Queue -->
        <div class="lg:col-span-2 space-y-6">

            <!-- Developer Simulation Banner (Visible in Dev Mode) -->
            <div id="dev-sandbox-banner"
                class="bg-indigo-950/50 border border-indigo-500/30 rounded-2xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center">
                        <i class="fa-solid fa-toolbox text-sm"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-semibold text-indigo-200">Developer Testing Sandbox Active</h3>
                        <p class="text-[11px] text-slate-400">Instantly simulate publishing queued posts for testing
                            without waiting for live cron triggers.</p>
                    </div>
                </div>
                <button onclick="simulatePublishing()" class="px-3 py-2 bg-indigo-60
